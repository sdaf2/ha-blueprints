blueprint:
  name: "GoodNight Pro"
  description: >
    Versión Avanzada: Apagado general de la casa y luces pasarela temporizadas.
    Permite configurar restricciones (ej: Solo de noche) y distintos métodos de apagado (por un tiempo fijo, por sensor de presencia o dejarlas encendidas).
  domain: automation
  input:
    # 1. TRIGGERS Y CONDICIONES
    custom_triggers:
      name: "⚡ ¿Qué activa esto? (Disparadores libres)"
      description: "Ejemplos: Cuando la TV se apaga, cuando presionas un botón..."
      default: []
      selector:
        trigger: {}
        
    only_at_night:
      name: "🌙 Restricción: Activar SOLO de noche"
      description: "Si activas esto, se usa el Sol de restricción. Si lo desmarcas, funcionará a cualquier hora."
      default: false
      selector:
        boolean: {}
        
    custom_conditions:
      name: "🛡️ Condiciones Extra (Opcional)"
      description: "Si además quieres poner más reglas manuales (estar en casa, etc), añádelas aquí."
      default: []
      selector:
        condition: {}
        
    # 2. ACCIONES "APAGAR TODO"
    areas_to_turn_off:
      name: "🏠 Zonas o Luces a Apagar (Apagado General)"
      description: "Todo lo seleccionado aquí se apagará de golpe."
      selector:
        target: {}
        
    # 3. ACCIONES "RECORRIDO"
    path_lights:
      name: "💡 Luces del Recorrido Seguro"
      description: "Luces que se encienden para ver el camino a la cama."
      selector:
        target:
          entity:
            - domain: light
            
    path_brightness:
      name: "🔅 Brillo del Recorrido (%)"
      default: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          
    # 4. LÓGICA DE APAGADO
    use_fixed_delay:
      name: "⏳ Apagar por Temporizador Fijo"
      description: "Actívalo para que el pasillo se apague solo después de un tiempo concreto."
      default: true
      selector:
        boolean: {}
    fixed_delay_time:
      name: "↳ ⏱️ Temporizador Fijo (Segundos)"
      default: 120
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: "segundos"

    use_motion_sensor:
      name: "🏃‍♂️ Apagar por Sensor de Presencia (Anula el fijo)"
      description: "Si lo activas, mandará sobre el tiempo fijo. Las luces solo se apagarán cuando no detecten movimiento."
      default: false
      selector:
        boolean: {}
    motion_sensor:
      name: "↳ 👁️ Sensor de Presencia"
      default: []
      selector:
        entity:
          domain: binary_sensor
          
    motion_delay_time:
      name: "↳ ⏱️ Temporizador del Sensor (Segundos sin movimiento)"
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: "segundos"

mode: restart

# VARIABLES
variables:
  solo_noche: !input only_at_night
  use_motion_sensor: !input use_motion_sensor
  sensor_ent: !input motion_sensor
  use_fixed_delay: !input use_fixed_delay

# CEREBRO
trigger: !input custom_triggers

# CONDICIONES
condition:
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ solo_noche == false }}"
      - condition: state
        entity_id: sun.sun
        state: "below_horizon"
  - condition: and
    conditions: !input custom_conditions

# MÚSCULO
action:
  - service: homeassistant.turn_off
    target: !input areas_to_turn_off

  - service: light.turn_on
    target: !input path_lights
    data:
      brightness_pct: !input path_brightness

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ use_motion_sensor == true }}"
        sequence:
          - wait_for_trigger:
              - platform: template
                value_template: "{{ is_state(sensor_ent, 'off') }}"
                for:
                  seconds: !input motion_delay_time
            timeout:
              minutes: 120
            continue_on_timeout: true
          - service: light.turn_off
            target: !input path_lights

      - conditions:
          - condition: template
            value_template: "{{ use_fixed_delay == true }}"
        sequence:
          - delay:
              seconds: !input fixed_delay_time
          - service: light.turn_off
            target: !input path_lights
