# =============================================================================
# EV CHARGING SYNC AUTOMATIONS (Sincronización Bidireccional App Tesla ↔ HA)
# =============================================================================
# Estas automatizaciones complementan el blueprint principal permitiendo que:
#   1. Si el usuario pulsa "Iniciar Carga" en la App de Tesla:
#      - HA cambia automáticamente el modo a "Nocturno / Finde" (si es de noche)
#      - O cambia a "Manual" (si es de día).
#   2. Si el usuario pulsa "Detener Carga" en la App de Tesla:
#      - HA cambia automáticamente el modo a "Apagado".
#   3. Si el usuario cambia el amperaje en la App de Tesla:
#      - HA actualiza la barra de amperios de modo manual.
#   4. Reset automático al desconectar el cable.
# =============================================================================

# -----------------------------------------------------------------------------
# AUTOMATIZACIÓN 1: Sync Tesla App → HA (Amperaje)
# -----------------------------------------------------------------------------
- id: ev_sync_tesla_to_ha_amps
  alias: "⚡ EV Sync: App Tesla → HA Amperaje"
  description: >
    Si el usuario cambia el amperaje desde la app Tesla o pantalla del coche,
    actualiza el slider de amperios en Home Assistant.
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: number.garaje_nafnaf_corriente_de_carga
  condition:
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in ['unknown', 'unavailable', 'none'] }}
  action:
    - if:
        - condition: template
          value_template: "{{ states('input_number.amperios_carga_manual') != 'unknown' }}"
      then:
        - service: input_number.set_value
          target:
            entity_id: input_number.amperios_carga_manual
          data:
            value: "{{ trigger.to_state.state | float(16) | round(0) | int }}"
          continue_on_error: true
    - if:
        - condition: template
          value_template: "{{ states('input_number.evsmartampere') != 'unknown' }}"
      then:
        - service: input_number.set_value
          target:
            entity_id: input_number.evsmartampere
          data:
            value: "{{ trigger.to_state.state | float(16) | round(0) | int }}"
          continue_on_error: true

# -----------------------------------------------------------------------------
# AUTOMATIZACIÓN 2: App Tesla "Iniciar Carga" → Activa Modo Manual / Nocturno en HA
# -----------------------------------------------------------------------------
- id: ev_sync_tesla_start_to_ha_mode
  alias: "🚀 EV Sync: App Tesla Iniciar Carga → Activa Modo en HA"
  description: >
    Si el usuario pulsa 'Iniciar Carga' en la App de Tesla mientras HA está en Apagado,
    HA cambia el modo a Nocturno (si es de noche) o a Manual (si es de día).
  mode: single
  trigger:
    - platform: state
      entity_id: switch.garaje_nafnaf_carga
      from: "off"
      to: "on"
      for:
        seconds: 5
  condition:
    # Solo actuar si el modo actual en HA es Apagado o si estaba marcado como parado por usuario
    - condition: template
      value_template: >
        {{ states('input_select.ev_modo_carga') == 'Apagado' or is_state('input_boolean.ev_tesla_parado_usuario', 'on') }}
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_tesla_parado_usuario
    - choose:
        # Si estamos en horario nocturno -> Pasar a Nocturno / Finde
        - conditions:
            - condition: template
              value_template: >
                {% set h_start = states('input_datetime.hora_inicio_nocturna') %}
                {% set h_finish = states('input_datetime.hora_fin_nocturna') %}
                {% set now_time = now().strftime('%H:%M:%S') %}
                {% if h_start <= h_finish %}
                  {{ now_time >= h_start and now_time <= h_finish }}
                {% else %}
                  {{ now_time >= h_start or now_time <= h_finish }}
                {% endif %}
          sequence:
            - service: input_select.select_option
              target:
                entity_id: input_select.ev_modo_carga
              data:
                option: "Nocturno / Finde"
      default:
        # De día -> Pasar a Manual
        - service: input_select.select_option
          target:
            entity_id: input_select.ev_modo_carga
          data:
            option: "Manual"

# -----------------------------------------------------------------------------
# AUTOMATIZACIÓN 3: App Tesla "Detener Carga" → Activa Modo Apagado en HA
# -----------------------------------------------------------------------------
- id: ev_sync_tesla_stop_to_ha_mode
  alias: "🛑 EV Sync: App Tesla Detener Carga → Modo Apagado en HA"
  description: >
    Si el usuario detiene la carga manualmente desde la App de Tesla,
    cambia el selector global de HA a 'Apagado' para reflejar la intención del usuario.
  mode: single
  trigger:
    - platform: state
      entity_id: switch.garaje_nafnaf_carga
      from: "on"
      to: "off"
      for:
        seconds: 15
  condition:
    - condition: template
      value_template: >
        {{ states('input_select.ev_modo_carga') != 'Apagado' }}
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_tesla_parado_usuario
    - service: input_select.select_option
      target:
        entity_id: input_select.ev_modo_carga
      data:
        option: "Apagado"

# -----------------------------------------------------------------------------
# AUTOMATIZACIÓN 4: Reset al Desconectar el Cable
# -----------------------------------------------------------------------------
- id: ev_reset_on_cable_disconnect
  alias: "🔌 EV Sync: Reset al Desconectar Cable"
  description: >
    Al desenchufar el cable del Tesla, resetea banderas de usuario.
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.garaje_nafnaf_estado
      to: "off"
      for:
        seconds: 10
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_tesla_parado_usuario
