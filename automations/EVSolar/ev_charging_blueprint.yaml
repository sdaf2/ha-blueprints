blueprint:
  name: "Gestor Inteligente de Carga Vehículo Eléctrico (EV)"
  description: >
    Control de carga avanzado para VE en 4 modos (Apagado, Manual, Tarifa Nocturna/Finde, Solar).
    Optimizado para inversor GoodWe (Meter 2 Active Power, PV Power, Battery SoC, Battery Power) y cargador Raedian/Tesla.
    Incluye temporización anti-flapping (duración mínima y retardo de reconexión), suavizado de potencia y control de prioridades.
  domain: automation
  input:
    cable_sensor:
      name: "🔌 Sensor de Cable Conectado"
      description: "Sensor del cargador Raedian o Tesla que indica si el cable está enchufado."
      selector:
        entity:
          domain: [sensor, binary_sensor]

    modo_carga_select:
      name: "🎛️ Selector de Modo de Carga"
      description: "input_select con las opciones: Apagado, Manual, Nocturno / Finde, Solar."
      selector:
        entity:
          domain: input_select

    amperios_manual_input:
      name: "⚡ Selector Amperios Manual"
      selector:
        entity:
          domain: input_number

    amperios_nocturna_input:
      name: "🌙 Selector Amperios Nocturna"
      selector:
        entity:
          domain: input_number

    hora_inicio_nocturna_input:
      name: "⏰ Hora Inicio Nocturna"
      selector:
        entity:
          domain: input_datetime

    hora_fin_nocturna_input:
      name: "⏰ Hora Fin Nocturna"
      selector:
        entity:
          domain: input_datetime

    net_power_sensor:
      name: "⚡ Sensor Potencia de Red / Meter (W)"
      description: "Sensor de consumo de red (ej. Meter 2 Active Power). Debe ser NEGATIVO cuando exporta a red."
      default: sensor.meter_2_active_power
      selector:
        entity:
          domain: sensor
          device_class: power

    pv_power_sensor:
      name: "☀️ Sensor Producción Solar PV (W)"
      description: "Sensor de generación fotovoltaica (ej. PV Power de GoodWe)."
      default: sensor.pv_power
      selector:
        entity:
          domain: sensor
          device_class: power

    battery_soc_sensor:
      name: "🔋 Sensor SoC Batería Casa (%)"
      description: "Sensor de porcentaje de batería (ej. Battery State of Charge de GoodWe)."
      default: sensor.battery_state_of_charge
      selector:
        entity:
          domain: sensor
          device_class: battery

    battery_power_sensor:
      name: "🔋 Sensor Potencia Batería Casa (W)"
      description: "Potencia de carga/descarga de la batería (ej. Battery Power de GoodWe). Negativo = cargando."
      default: sensor.battery_power
      selector:
        entity:
          domain: sensor
          device_class: power

    min_battery_soc_input:
      name: "🔋 Mínimo SoC Batería Casa"
      description: "input_number con el % mínimo de batería doméstica antes de ceder excedentes al EV."
      selector:
        entity:
          domain: input_number

    priority_block_entity:
      name: "🚫 Bloqueo por Dispositivos Prioritarios (Opcional)"
      description: "Entidad (ej. Termo / Aerotermia) que si está activa bloquea la carga solar del EV."
      default: []
      selector:
        entity:

    min_charge_time_input:
      name: "⏱️ Tiempo Mínimo de Carga Continuada (min)"
      selector:
        entity:
          domain: input_number

    stop_delay_input:
      name: "⏱️ Tiempo Mínimo de Pausa (min)"
      selector:
        entity:
          domain: input_number

    amp_change_delay_input:
      name: "🌊 Estabilización de Amperaje (s)"
      selector:
        entity:
          domain: input_number

    charger_switch_entity:
      name: "🔌 Switch del Cargador (Wallbox Raedian / Tesla)"
      selector:
        entity:
          domain: [switch, input_boolean]

    charger_current_entity:
      name: "⚙️ Entidad Control de Amperaje (Raedian / Tesla)"
      selector:
        entity:
          domain: number

mode: restart

variables:
  var_cable: !input cable_sensor
  var_modo: !input modo_carga_select
  var_amp_manual: !input amperios_manual_input
  var_amp_nocturna: !input amperios_nocturna_input
  var_h_inicio: !input hora_inicio_nocturna_input
  var_h_fin: !input hora_fin_nocturna_input
  var_net_power: !input net_power_sensor
  var_pv_power: !input pv_power_sensor
  var_soc: !input battery_soc_sensor
  var_bat_power: !input battery_power_sensor
  var_min_soc: !input min_battery_soc_input
  var_prio_block: !input priority_block_entity
  var_min_charge_m: !input min_charge_time_input
  var_stop_delay_m: !input stop_delay_input
  var_amp_delay_s: !input amp_change_delay_input
  var_sw: !input charger_switch_entity
  var_num_curr: !input charger_current_entity

trigger:
  - platform: state
    entity_id: !input modo_carga_select
  - platform: state
    entity_id: !input cable_sensor
  - platform: state
    entity_id: !input amperios_manual_input
  - platform: state
    entity_id: !input amperios_nocturna_input
  - platform: state
    entity_id: !input net_power_sensor
  - platform: state
    entity_id: !input battery_soc_sensor
  - platform: state
    entity_id: !input priority_block_entity
  - platform: time_pattern
    minutes: "/1"

action:
  # 1. FILTRO DE SEGURIDAD: Comprobar si el cable está conectado
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ is_state(var_cable, 'on') or 
                 is_state(var_cable, 'Conectado') or 
                 is_state(var_cable, 'connected') or 
                 is_state(var_cable, 'true') }}
        sequence:
          # 2. SELECTOR DE MODOS DE CARGA
          - choose:
              # -------------------------------------------------------------
              # MODO 1: MANUAL
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(var_modo, 'Manual') }}"
                sequence:
                  - service: number.set_value
                    target:
                      entity_id: !input charger_current_entity
                    data:
                      value: "{{ states(var_amp_manual) | float(16) }}"
                  - service: switch.turn_on
                    target:
                      entity_id: !input charger_switch_entity

              # -------------------------------------------------------------
              # MODO 2: NOCTURNO / FINDE
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(var_modo, 'Nocturno / Finde') }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {% set es_finde = now().weekday() in [5, 6] %}
                              {% set t_now = now().strftime('%H:%M:%S') %}
                              {% set t_start = states(var_h_inicio) %}
                              {% set t_end = states(var_h_fin) %}
                              {% set en_tramo_nocturno = (t_now >= t_start or t_now <= t_end) if (t_start > t_end) else (t_now >= t_start and t_now <= t_end) %}
                              {{ es_finde or en_tramo_nocturno }}
                        sequence:
                          - service: number.set_value
                            target:
                              entity_id: !input charger_current_entity
                            data:
                              value: "{{ states(var_amp_nocturna) | float(16) }}"
                          - service: switch.turn_on
                            target:
                              entity_id: !input charger_switch_entity
                    default:
                      - service: switch.turn_off
                        target:
                          entity_id: !input charger_switch_entity

              # -------------------------------------------------------------
              # MODO 3: SOLAR (GOODWE METER 2 + BATTERY POWER + HISTERESIS)
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(var_modo, 'Solar') }}"
                sequence:
                  - variables:
                      sw_state: "{{ states(var_sw) }}"
                      sw_last_changed: "{{ (now() - states[var_sw].last_changed).total_seconds() if states[var_sw] is defined and states[var_sw].last_changed is defined else 99999 }}"
                      curr_last_changed: "{{ (now() - states[var_num_curr].last_changed).total_seconds() if states[var_num_curr] is defined and states[var_num_curr].last_changed is defined else 99999 }}"
                      min_charge_sec: "{{ (states(var_min_charge_m) | float(5)) * 60 }}"
                      stop_delay_sec: "{{ (states(var_stop_delay_m) | float(3)) * 60 }}"
                      amp_delay_sec: "{{ states(var_amp_delay_s) | float(60) }}"
                      has_priority_block: "{{ var_prio_block != [] and is_state(var_prio_block, 'on') }}"
                      
                      current_soc: "{{ states(var_soc) | float(0) }}"
                      min_soc_req: "{{ states(var_min_soc) | float(80) }}"
                      soc_ok: "{{ current_soc >= min_soc_req }}"
                      
                      net_power_w: "{{ states(var_net_power) | float(0) }}"
                      bat_power_w: "{{ states(var_bat_power) | float(0) if var_bat_power != [] else 0 }}"
                      
                      # Excedente exportado a red (Meter 2 Active Power es negativo cuando exporta)
                      exported_surplus_w: "{{ (net_power_w * -1) if net_power_w < 0 else 0 }}"
                      
                      # Si la batería doméstica ya superó el SoC mínimo y se está cargando (bat_power < 0), sumar esa potencia al EV
                      battery_charge_surplus_w: "{{ (bat_power_w * -1) if (soc_ok and bat_power_w < 0) else 0 }}"
                      
                      total_available_w: "{{ exported_surplus_w + battery_charge_surplus_w }}"
                      calculated_amps: "{{ (total_available_w / 230) | int(0) }}"
                      has_enough_sun: "{{ calculated_amps >= 6 }}"

                  - choose:
                      # CASO A: Iniciar o mantener carga solar
                      - conditions:
                          - condition: template
                            value_template: "{{ not has_priority_block }}"
                          - condition: template
                            value_template: "{{ soc_ok }}"
                          - condition: template
                            value_template: >-
                              {{ has_enough_sun or (sw_state == 'on' and sw_last_changed < min_charge_sec) }}
                          - condition: template
                            value_template: >-
                              {{ sw_state == 'on' or sw_last_changed >= stop_delay_sec }}
                        sequence:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ curr_last_changed >= amp_delay_sec }}"
                                sequence:
                                  - service: number.set_value
                                    target:
                                      entity_id: !input charger_current_entity
                                    data:
                                      value: "{{ [ [calculated_amps, 6] | max, 32 ] | min }}"
                          - service: switch.turn_on
                            target:
                              entity_id: !input charger_switch_entity

                    # CASO B: Parar carga solar
                    default:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ sw_state == 'off' or sw_last_changed >= min_charge_sec }}"
                            sequence:
                              - service: switch.turn_off
                                target:
                                  entity_id: !input charger_switch_entity

              # -------------------------------------------------------------
              # MODO 4: APAGADO
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(var_modo, 'Apagado') }}"
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: !input charger_switch_entity

            default:
              - service: switch.turn_off
                target:
                  entity_id: !input charger_switch_entity

    # SI NO HAY CABLE CONECTADO: Apagar cargador
    default:
      - service: switch.turn_off
        target:
          entity_id: !input charger_switch_entity
