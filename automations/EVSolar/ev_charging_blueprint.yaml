blueprint:
  name: "EV Smart"
  source_url: https://raw.githubusercontent.com/sdaf2/ha-blueprints/main/automations/EVSolar/ev_charging_blueprint.yaml
  description: >
    Control de carga avanzado para VE. Incluye modo Automático (Solar de día / Nocturno de noche),
    Manual, Solar y Nocturno. Configuración del signo de inyección a red para Meter GoodWe,
    Protección Dinámica Doble en Modo Solar (Límite Consumo Total Casa 10kW + Límite Solo Red 3.5kW),
    Detección de Vehículo Único y Reparto Inteligente de Potencia
    (si un coche completa su carga al 100%, la carga se apaga automáticamente o pasa el 100% de la energía solar disponible al 2º coche),
    Soporte de Batería de Casa al caer el Sol (> SoC Mínimo) para mantener carga continuada,
    Temporizador de Pausa Continuada (no desconecta hasta transcurrir el tiempo de pausa mínimo)
    y Temporizador Estricto de Amperaje (mantiene amperios estables sin cambios bruscos).
  domain: automation
  input:
    # --- VEHÍCULO 1 (ej. Tesla Propio) ---
    car_1_cable_sensor:
      name: "🚗 Sensor de Cable - Coche 1 (Tesla)"
      description: "Sensor o binary_sensor del coche que indica si el cable está conectado (ej. garaje_nafnaf_cable_de_carga)."
      default: binary_sensor.garaje_nafnaf_cable_de_carga
      selector:
        entity:
          domain: [sensor, binary_sensor]

    car_1_state_sensor:
      name: "🚗 Sensor Estado de Carga - Coche 1 (Opcional)"
      description: "Sensor que indica el estado del coche (ej. sensor.garaje_nafnaf_estado_de_carga). Al llegar al 100% / Complete, apaga la carga o pasa la potencia al Coche 2."
      default: {}
      selector:
        entity:
          domain: [sensor, binary_sensor]

    car_1_switch:
      name: "🚗 Control Carga - Coche 1 (Tesla Switch)"
      default: {}
      selector:
        target:
          entity:
            - domain: switch
            - domain: button

    car_1_current_number:
      name: "⚙️ Amperaje - Coche 1 (Tesla Current Number)"
      default: {}
      selector:
        target:
          entity:
            - domain: number

    # --- DOCK / WALLBOX ---
    wallbox_cable_sensor:
      name: "🔌 Sensor de Cable del Wallbox (Status Connector - Opcional)"
      description: "Sensor de estado del cargador en la integración OCPP (ej. Status Connector). Déjalo vacío si no tienes esta entidad."
      default: {}
      selector:
        entity:
          domain: [sensor, binary_sensor]

    wallbox_switch:
      name: "🔌 Switch Availability del Wallbox (Raedian)"
      description: "Switch de disponibilidad del Wallbox (Availability). Si solo tienes un switch, configura el mismo en ambos campos."
      selector:
        target:
          entity:
            - domain: switch

    wallbox_charge_control_switch:
      name: "🔌 Switch Charge Control del Wallbox (Opcional)"
      description: "Switch de control de carga del Wallbox (Charge Control). Si tu Wallbox tiene este switch separado, configúralo aquí. Déjalo vacío si solo hay un switch."
      default: {}
      selector:
        target:
          entity:
            - domain: switch

    wallbox_current_number:
      name: "⚙️ Amperaje del Cargador (Wallbox Raedian)"
      description: "Número de amperios del Wallbox."
      selector:
        target:
          entity:
            - domain: number

    # --- VEHÍCULO 2 (ej. Segundo Coche) ---
    car_2_cable_sensor:
      name: "🚗 Sensor de Cable - Coche 2 (Opcional)"
      default: {}
      selector:
        entity:
          domain: [sensor, binary_sensor]

    car_2_state_sensor:
      name: "🚗 Sensor Estado de Carga - Coche 2 (Opcional)"
      description: "Sensor que indica el estado de carga del Coche 2."
      default: {}
      selector:
        entity:
          domain: [sensor, binary_sensor]

    car_2_switch:
      name: "🚗 Control Carga - Coche 2 (Opcional)"
      default: {}
      selector:
        target:
          entity:
            - domain: switch
            - domain: button

    car_2_current_number:
      name: "⚙️ Amperaje - Coche 2 (Opcional)"
      default: {}
      selector:
        target:
          entity:
            - domain: number

    # --- CONFIGURACIÓN DE MEDIDOR GOODWE ---
    net_power_sign:
      name: "↕️ Signo del Meter al Exportar/Inyectar Solar a la Red"
      description: "¿Cómo marca tu medidor Meter 2 de GoodWe cuando regalas/exportas energía a la red? (Selecciona Positiva (+) si marca +2500W al inyectar)."
      default: "Positiva (+)"
      selector:
        select:
          options:
            - "Positiva (+)"
            - "Negativa (-)"

    # --- CONFIGURACIÓN DE MODOS Y POTENCIAS ---
    modo_carga_select:
      name: "🎛️ Selector de Modo de Carga"
      selector:
        entity:
          domain: input_select

    estrategia_reparto_select:
      name: "⚖️ Selector Estrategia Reparto Multi-Vehículo"
      default: {}
      selector:
        entity:
          domain: input_select

    porcentaje_coche_1_input:
      name: "📊 Porcentaje Reparto Coche 1"
      default: {}
      selector:
        entity:
          domain: input_number

    max_house_power_input:
      name: "⚡ Límite Potencia Combinada (Solar/Batería/Red) (W)"
      description: "Potencia máxima total que puede consumir la casa completa incluyendo el cargador (ej. 10000W para no superar 10kW)."
      default: {}
      selector:
        entity:
          domain: input_number

    max_grid_power_input:
      name: "🔌 Límite Potencia Solo Red (Sin Batería/Solar) (W)"
      description: "Potencia máxima a importar de la red cuando no hay sol ni batería (ej. 3500W de término fijo ICP)."
      default: {}
      selector:
        entity:
          domain: input_number

    amperios_manual_input:
      name: "⚡ Selector Amperios Manual"
      selector:
        entity:
          domain: input_number

    amperios_nocturna_input:
      name: "🌙 Selector Amperios Nocturna"
      selector:
        entity:
          domain: input_number

    hora_inicio_nocturna_input:
      name: "⏰ Hora Inicio Nocturna"
      selector:
        entity:
          domain: input_datetime

    hora_fin_nocturna_input:
      name: "⏰ Hora Fin Nocturna"
      selector:
        entity:
          domain: input_datetime

    net_power_sensor:
      name: "⚡ Sensor Potencia de Red / Meter (W)"
      default: sensor.meter_2_active_power
      selector:
        entity:
          domain: sensor
          device_class: power

    house_consumption_power_sensor:
      name: "🏠 Sensor Consumo Total Casa / Inversor (W - Opcional)"
      description: "Sensor de consumo total de la casa (ej. sensor.load_power / sensor.house_consumption). Si se deja vacío, se calcula automáticamente."
      default: {}
      selector:
        entity:
          domain: sensor
          device_class: power

    pv_power_sensor:
      name: "☀️ Sensor Producción Solar PV (W)"
      default: sensor.pv_power
      selector:
        entity:
          domain: sensor
          device_class: power

    battery_soc_sensor:
      name: "🔋 Sensor SoC Batería Casa (%)"
      default: sensor.battery_state_of_charge
      selector:
        entity:
          domain: sensor
          device_class: battery

    battery_power_sensor:
      name: "🔋 Sensor Potencia Batería Casa (W)"
      default: sensor.battery_power
      selector:
        entity:
          domain: sensor
          device_class: power

    min_battery_soc_input:
      name: "🔋 Mínimo SoC Batería Casa"
      selector:
        entity:
          domain: input_number

    priority_block_entity:
      name: "🚫 Bloqueo por Dispositivos Prioritarios (Opcional)"
      default: []
      selector:
        entity:

    min_charge_time_input:
      name: "⏱️ Tiempo Mínimo de Carga Continuada (min)"
      selector:
        entity:
          domain: input_number

    stop_delay_input:
      name: "⏱️ Tiempo Mínimo de Pausa (min)"
      selector:
        entity:
          domain: input_number

    amp_change_delay_input:
      name: "🌊 Estabilización de Amperaje (s)"
      selector:
        entity:
          domain: input_number

mode: restart

variables:
  var_wb_cable: !input wallbox_cable_sensor
  var_c1_cable: !input car_1_cable_sensor
  var_c1_state: !input car_1_state_sensor
  var_c2_cable: !input car_2_cable_sensor
  var_c2_state: !input car_2_state_sensor
  var_sign_setting: !input net_power_sign
  var_modo: !input modo_carga_select
  var_estrategia: !input estrategia_reparto_select
  var_p_coche1: !input porcentaje_coche_1_input
  var_max_house_w: !input max_house_power_input
  var_max_grid_w: !input max_grid_power_input
  var_amp_manual: !input amperios_manual_input
  var_amp_nocturna: !input amperios_nocturna_input
  var_h_inicio: !input hora_inicio_nocturna_input
  var_h_fin: !input hora_fin_nocturna_input
  var_wb_sw: !input wallbox_switch
  var_wb_cc: !input wallbox_charge_control_switch
  var_wb_num: !input wallbox_current_number
  var_c1_sw: !input car_1_switch
  var_c1_num: !input car_1_current_number
  var_c2_sw: !input car_2_switch
  var_c2_num: !input car_2_current_number
  var_net_power: !input net_power_sensor
  var_house_power: !input house_consumption_power_sensor
  var_pv_power: !input pv_power_sensor
  var_soc: !input battery_soc_sensor
  var_bat_power: !input battery_power_sensor
  var_min_soc: !input min_battery_soc_input
  var_prio_block: !input priority_block_entity
  var_min_charge_m: !input min_charge_time_input
  var_stop_delay_m: !input stop_delay_input
  var_amp_delay_s: !input amp_change_delay_input

trigger:
  - platform: state
    entity_id: !input modo_carga_select
  - platform: state
    entity_id: !input car_1_cable_sensor
  - platform: state
    entity_id: !input amperios_manual_input
  - platform: state
    entity_id: !input amperios_nocturna_input
  - platform: state
    entity_id: !input net_power_sensor
    for:
      seconds: 5
  - platform: state
    entity_id: !input battery_soc_sensor
  - platform: time_pattern
    minutes: "/1"

action:
  # =================================================================
  # PASO 1: LECTURA DE ENTIDADES Y ESTADOS BÁSICOS
  # =================================================================
  - variables:
      wb_val: "{{ (states(var_wb_cable) | lower) if (var_wb_cable is string and var_wb_cable != '' and var_wb_cable != 'none') else 'unavailable' }}"
      c1_val: "{{ (states(var_c1_cable) | lower) if (var_c1_cable is string and var_c1_cable != '' and var_c1_cable != 'none') else 'unavailable' }}"
      c2_val: "{{ (states(var_c2_cable) | lower) if (var_c2_cable is string and var_c2_cable != '' and var_c2_cable != 'none') else 'unavailable' }}"

      c1_st_val: >-
        {% if var_c1_state is string and var_c1_state != '' and var_c1_state != 'none' %}
          {{ states(var_c1_state) | lower }}
        {% else %}
          charging
        {% endif %}
      c2_st_val: >-
        {% if var_c2_state is string and var_c2_state != '' and var_c2_state != 'none' %}
          {{ states(var_c2_state) | lower }}
        {% else %}
          charging
        {% endif %}

      is_c1_connected: >-
        {{ (c1_val in ['on', 'true', 'conectado', 'connected', 'charging', 'cargando', 'pluggedin', 'plugged_in', 'online', '1', 'off', 'false']) and (c1_val not in ['unavailable', 'unknown', 'disconnected', 'desconectado', 'unplugged', 'none']) }}
      is_c2_connected: >-
        {{ (c2_val in ['on', 'true', 'conectado', 'connected', 'charging', 'cargando', 'pluggedin', 'plugged_in', 'online', '1', 'off', 'false']) and (c2_val not in ['unavailable', 'unknown', 'disconnected', 'desconectado', 'unplugged', 'none']) }}

      # Si no hay sensor de cable de Wallbox asignado (var_wb_cable: {}), el Wallbox se considera conectado si hay Wallbox configurado o si el coche está conectado
      is_wb_connected: >-
        {% if var_wb_cable is string and var_wb_cable != '' and var_wb_cable != 'none' and var_wb_cable != {} %}
          {{ wb_val in ['on', 'true', 'conectado', 'connected', 'preparing', 'charging', 'suspendedev', 'suspendedevse', 'occupied', 'finishing', '1', 'plugged_in', 'cargando'] }}
        {% else %}
          true
        {% endif %}

      # ¿Está el vehículo activamente necesitado de carga? (False solo si ya completó la carga al 100%)
      is_c1_active: >-
        {{ is_c1_connected and (c1_st_val not in ['complete', 'completed', 'completo', 'full', '100%', '100']) }}
      is_c2_active: >-
        {{ is_c2_connected and (c2_st_val not in ['complete', 'completed', 'completo', 'full', '100%', '100']) }}

      any_cable_connected: "{{ is_wb_connected or is_c1_connected or is_c2_connected }}"
      has_known_car_connected: "{{ is_c1_connected or is_c2_connected }}"
      
      # Número de coches ACTIVOS cargando (si está conectado por Wallbox sin coche individual, cuenta como 1)
      active_cars_count: "{{ (1 if is_c1_active else 0) + (1 if is_c2_active else 0) }}"
      num_active_cars: "{{ active_cars_count if active_cars_count > 0 else (1 if is_wb_connected else 0) }}"

      raw_modo_str: "{{ states(var_modo) }}"
      es_finde: "{{ now().weekday() in [5, 6] }}"
      t_now: "{{ now().strftime('%H:%M:%S') }}"
      t_start: "{{ states(var_h_inicio)[:8] if (states(var_h_inicio) | length) >= 8 else '00:00:00' }}"
      t_end: "{{ states(var_h_fin)[:8] if (states(var_h_fin) | length) >= 8 else '08:00:00' }}"
      en_tramo_nocturno: "{{ (t_now >= t_start or t_now <= t_end) if (t_start > t_end) else (t_now >= t_start and t_now <= t_end) }}"
      es_horario_nocturno: "{{ es_finde or en_tramo_nocturno }}"

      effective_modo: >-
        {% if 'Automático' in raw_modo_str %}
          {{ 'Nocturno / Finde' if es_horario_nocturno else 'Solar' }}
        {% else %}
          {{ raw_modo_str }}
        {% endif %}

      c1_sw_ent: "{{ var_c1_sw.entity_id[0] if var_c1_sw.entity_id is defined and var_c1_sw.entity_id is list else (var_c1_sw.entity_id if var_c1_sw.entity_id is defined else (var_c1_sw if var_c1_sw != {} else '')) }}"
      c1_num_ent: "{{ var_c1_num.entity_id[0] if var_c1_num.entity_id is defined and var_c1_num.entity_id is list else (var_c1_num.entity_id if var_c1_num.entity_id is defined else (var_c1_num if var_c1_num != {} else '')) }}"
      
      c2_sw_ent: "{{ var_c2_sw.entity_id[0] if var_c2_sw.entity_id is defined and var_c2_sw.entity_id is list else (var_c2_sw.entity_id if var_c2_sw.entity_id is defined else (var_c2_sw if var_c2_sw != {} else '')) }}"
      c2_num_ent: "{{ var_c2_num.entity_id[0] if var_c2_num.entity_id is defined and var_c2_num.entity_id is list else (var_c2_num.entity_id if var_c2_num.entity_id is defined else (var_c2_num if var_c2_num != {} else '')) }}"

      wb_sw_ent: "{{ var_wb_sw.entity_id[0] if var_wb_sw.entity_id is defined and var_wb_sw.entity_id is list else (var_wb_sw.entity_id if var_wb_sw.entity_id is defined else (var_wb_sw if var_wb_sw != {} else '')) }}"
      wb_cc_ent: "{{ var_wb_cc.entity_id[0] if var_wb_cc.entity_id is defined and var_wb_cc.entity_id is list else (var_wb_cc.entity_id if var_wb_cc.entity_id is defined else (var_wb_cc if var_wb_cc != {} else '')) }}"
      wb_num_ent: "{{ var_wb_num.entity_id[0] if var_wb_num.entity_id is defined and var_wb_num.entity_id is list else (var_wb_num.entity_id if var_wb_num.entity_id is defined else (var_wb_num if var_wb_num != {} else '')) }}"


  # =================================================================
  # PASO 2: LECTURAS DE POTENCIA (las entidades ya existen del PASO 1)
  # =================================================================
  - variables:
      raw_pv: "{{ states(var_pv_power) | float(0) }}"
      pv_w: "{{ (raw_pv * 1000) if (raw_pv > 0 and raw_pv <= 50) else raw_pv }}"
      
      current_soc: "{{ states(var_soc) | float(0) }}"
      min_soc_req: "{{ states(var_min_soc) | float(80) }}"
      target_hysteresis_soc: "{{ [ (min_soc_req + 10.0), 100.0 ] | min }}"
      is_currently_charging: "{{ is_state(wb_sw_ent, 'on') or (var_c1_sw != {} and is_state(c1_sw_ent, 'on')) or (var_c2_sw != {} and is_state(c2_sw_ent, 'on')) }}"

      has_energy_support: "{{ pv_w > 100 or current_soc > 10 }}"
      
      raw_limit_comb: "{{ states(var_max_house_w) | float(10000) if (var_max_house_w is string and var_max_house_w != '' and var_max_house_w != 'none') else 10000 }}"
      limit_combined_w: "{{ (raw_limit_comb * 1000) if (raw_limit_comb > 0 and raw_limit_comb <= 100) else raw_limit_comb }}"
      
      raw_limit_grid: "{{ states(var_max_grid_w) | float(3500) if (var_max_grid_w is string and var_max_grid_w != '' and var_max_grid_w != 'none') else 3500 }}"
      limit_grid_only_w: "{{ (raw_limit_grid * 1000) if (raw_limit_grid > 0 and raw_limit_grid <= 100) else raw_limit_grid }}"
      
      effective_house_limit_w: "{{ limit_combined_w if has_energy_support else limit_grid_only_w }}"

      raw_grid_val: "{{ states(var_net_power) | float(0) }}"
      raw_grid_w: "{{ (raw_grid_val * 1000) if (raw_grid_val > -50 and raw_grid_val < 50 and raw_grid_val != 0) else raw_grid_val }}"
      net_power_w: "{{ (raw_grid_w * -1) if var_sign_setting == 'Positiva (+)' else raw_grid_w }}"
      grid_import_w: "{{ net_power_w if net_power_w > 0 else 0 }}"
      exported_surplus_w: "{{ (net_power_w * -1) if net_power_w < 0 else 0 }}"

      c1_a_now: "{{ states(c1_num_ent) | float(0) if (var_c1_num is string and var_c1_num != '' and is_state(c1_sw_ent, 'on')) else 0 }}"
      c2_a_now: "{{ states(c2_num_ent) | float(0) if (var_c2_num is string and var_c2_num != '' and is_state(c2_sw_ent, 'on')) else 0 }}"
      wb_a_now: "{{ states(wb_num_ent) | float(0) if is_state(wb_sw_ent, 'on') else 0 }}"
      ev_current_w: "{{ ( (c1_a_now + c2_a_now) if (c1_a_now > 0 or c2_a_now > 0) else wb_a_now ) * 230 }}"


  # =================================================================
  # PASO 3: CALCULOS COMBINADOS Y MARGENES (ev_current_w ya existe)
  # =================================================================
  - variables:
      raw_bat: "{{ states(var_bat_power) | float(0) if (var_bat_power is string and var_bat_power != '' and var_bat_power != 'none') else 0 }}"
      bat_w: "{{ (raw_bat * 1000) if (raw_bat > -50 and raw_bat < 50 and raw_bat != 0) else raw_bat }}"
      bat_discharging_w: "{{ bat_w if bat_w > 0 else 0 }}"
      calc_total_house_w: "{{ pv_w + bat_discharging_w + grid_import_w }}"

      raw_house: >-
        {% if var_house_power is string and var_house_power != '' and var_house_power != 'none' %}
          {{ states(var_house_power) | float(calc_total_house_w) }}
        {% else %}
          {{ calc_total_house_w }}
        {% endif %}
      house_total_w: "{{ (raw_house * 1000) if (raw_house > 0 and raw_house <= 50) else raw_house }}"

      other_house_loads_w: "{{ [ (house_total_w - ev_current_w), 0 ] | max }}"
      available_house_margin_w: "{{ [ (effective_house_limit_w - other_house_loads_w), 0 ] | max }}"
      available_grid_margin_w: "{{ [ (limit_grid_only_w - grid_import_w + ev_current_w), 0 ] | max }}"

      max_safe_amps_house: "{{ (available_house_margin_w / 230) | int(0) }}"
      max_safe_amps_grid: "{{ (available_grid_margin_w / 230) | int(0) }}"
      max_safe_amps: "{{ max_safe_amps_house if has_energy_support else [ max_safe_amps_house, max_safe_amps_grid ] | min }}"

      has_priority_block: "{{ var_prio_block is string and var_prio_block != '' and var_prio_block != 'none' and is_state(var_prio_block, 'on') }}"

      soc_ok: >-
        {% if is_currently_charging %}
          {{ current_soc >= min_soc_req }}
        {% else %}
          {{ current_soc >= target_hysteresis_soc }}
        {% endif %}

      total_available_w: >-
        {% set net_solar = pv_w - other_house_loads_w %}
        {% set amps_base = net_solar / 230.0 %}
        {% set target_soc = [ (min_soc_req + 10.0), 100.0 ] | min %}
        {% set error_soc = current_soc - target_soc %}
        {% set kp_amps = 2.0 %}
        {% set pi_adjustment_amps = error_soc * kp_amps %}
        {% set raw_amps = amps_base + pi_adjustment_amps %}
        {% set is_chg = is_currently_charging %}
        {% set allow_charge = (current_soc >= min_soc_req and raw_amps >= 6.0) if is_chg else (current_soc >= target_hysteresis_soc and raw_amps >= 6.0) %}
        {% if allow_charge %}
          {{ raw_amps * 230.0 }}
        {% else %}
          0
        {% endif %}

      raw_calculated_amps: "{{ (total_available_w / 230) | int(0) }}"
      calculated_amps: "{{ [ raw_calculated_amps, max_safe_amps ] | min }}"
      has_enough_sun: "{{ calculated_amps >= 6 }}"
  # 2. FILTRO GENERAL DE CABLE
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ any_cable_connected }}"
        sequence:
          # --- GESTIÓN DE MODOS Y EJECUCIÓN ---
          - choose:
              # -------------------------------------------------------------
              # MODO 1: MANUAL - Arranca TODO incondicionalmente
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ effective_modo == 'Manual' }}"
                sequence:
                  - variables:
                      req_manual_amps: "{{ (states(var_amp_manual) | float(16)) | int(16) }}"
                      desired_amps: >-
                        {% set p_raw = states(var_pv_power) | float(0) %}
                        {% set p_w = (p_raw * 1000) if (p_raw > 0 and p_raw <= 50) else p_raw %}
                        {% set b_soc = states(var_soc) | float(0) %}
                        {% set energy_ok = (p_w > 100 or b_soc > 10) %}
                        {% set lim_g = states(var_max_grid_w) | float(3500) if (var_max_grid_w is string and var_max_grid_w != '' and var_max_grid_w != 'none') else 3500 %}
                        {% set max_g = (lim_g / 230) | int(15) %}
                        {{ req_manual_amps if energy_ok else [req_manual_amps, max_g] | min }}
                      safe_wb_manual: "{{ [ [desired_amps | int, 6] | max, 32 ] | min | int }}"
                      safe_c1_manual: "{{ [ [desired_amps | int, 6] | max, 32 ] | min | int }}"

                  # PASO 1: Wallbox Availability ON (solo si no está ya encendido)
                  - if:
                      - condition: template
                        value_template: "{{ not is_state(wb_sw_ent, 'on') }}"
                    then:
                      - service: switch.turn_on
                        target: !input wallbox_switch
                        continue_on_error: true

                  # PASO 2: Wallbox Charge Control ON
                  - if:
                      - condition: template
                        value_template: "{{ wb_cc_ent != '' }}"
                    then:
                      - service: switch.turn_on
                        target: !input wallbox_charge_control_switch
                        continue_on_error: true

                  # PASO 5: Tesla amperios = control de consumo
                  - if:
                      - condition: template
                        value_template: "{{ (states(c1_num_ent) | float(0)) != (safe_c1_manual | float(0)) }}"
                    then:
                      - service: number.set_value
                        target: !input car_1_current_number
                        data:
                          value: "{{ safe_c1_manual | int }}"
                        continue_on_error: true

              # -------------------------------------------------------------
              # MODO 2: NOCTURNO / FINDE - Arranca TODO incondicionalmente
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ effective_modo == 'Nocturno / Finde' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ es_horario_nocturno }}"
                        sequence:
                          - variables:
                              req_noct_amps: "{{ (states(var_amp_nocturna) | float(16)) | int(16) }}"
                              desired_amps: >-
                                {% set p_raw = states(var_pv_power) | float(0) %}
                                {% set p_w = (p_raw * 1000) if (p_raw > 0 and p_raw <= 50) else p_raw %}
                                {% set b_soc = states(var_soc) | float(0) %}
                                {% set energy_ok = (p_w > 100 or b_soc > 10) %}
                                {% set lim_g = states(var_max_grid_w) | float(3500) if (var_max_grid_w is string and var_max_grid_w != '' and var_max_grid_w != 'none') else 3500 %}
                                {% set max_g = (lim_g / 230) | int(15) %}
                                {{ req_noct_amps if energy_ok else [req_noct_amps, max_g] | min }}
                              safe_wb_noct: "{{ [ [desired_amps | int, 6] | max, 32 ] | min | int }}"
                              safe_c1_noct: "{{ [ [desired_amps | int, 6] | max, 32 ] | min | int }}"

                          # PASO 1: Wallbox Availability ON (solo si no está ya encendido)
                          - if:
                              - condition: template
                                value_template: "{{ not is_state(wb_sw_ent, 'on') }}"
                            then:
                              - service: switch.turn_on
                                target: !input wallbox_switch
                                continue_on_error: true

                          # PASO 2: Wallbox Charge Control ON
                          - if:
                              - condition: template
                                value_template: "{{ wb_cc_ent != '' }}"
                            then:
                              - service: switch.turn_on
                                target: !input wallbox_charge_control_switch
                                continue_on_error: true

                          # PASO 4: Tesla ON (solo si no está ya encendido y el usuario NO lo paró)
                          - if:
                              - condition: template
                                value_template: "{{ not is_state('input_boolean.ev_tesla_parado_usuario', 'on') and not is_state(c1_sw_ent, 'on') }}"
                            then:
                              - service: switch.turn_on
                                target: !input car_1_switch
                                continue_on_error: true

                          # PASO 5: Tesla amperios = control de consumo
                          - if:
                              - condition: template
                                value_template: "{{ (states(c1_num_ent) | float(0)) != (safe_c1_noct | float(0)) }}"
                            then:
                              - service: number.set_value
                                target: !input car_1_current_number
                                data:
                                  value: "{{ safe_c1_noct | int }}"
                                continue_on_error: true

                    default:
                      - service: switch.turn_off
                        target: !input car_1_switch
                        continue_on_error: true
                      - if:
                          - condition: template
                            value_template: "{{ wb_cc_ent != '' }}"
                        then:
                          - service: switch.turn_off
                            target: !input wallbox_charge_control_switch
                            continue_on_error: true

              # -------------------------------------------------------------
              # MODO 3: SOLAR (EXCEDENTES + APOYO BATERÍA + PROTECCIÓN DINÁMICA)
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ effective_modo == 'Solar' }}"
                sequence:
                  - variables:
                      estrategia_val: "{{ states(var_estrategia) if var_estrategia != {} else 'Equitativo (50/50)' }}"
                      pct_c1: "{{ (states(var_p_coche1) | float(50)) / 100.0 if var_p_coche1 != {} else 0.5 }}"
                      
                      amps_c1: >-
                        {% if not is_c1_active %}
                          0
                        {% elif num_active_cars > 1 %}
                          {% if estrategia_val == 'Prioridad (Coche 1)' %}
                            {{ calculated_amps }}
                          {% elif estrategia_val == 'Porcentaje Personalizado' %}
                            {{ (calculated_amps * pct_c1) | int(0) }}
                          {% else %}
                            {{ (calculated_amps / 2) | int(0) }}
                          {% endif %}
                        {% else %}
                          {{ calculated_amps }}
                        {% endif %}

                      amps_c2: >-
                        {% if not is_c2_active %}
                          0
                        {% elif num_active_cars > 1 %}
                          {% if estrategia_val == 'Prioridad (Coche 1)' %}
                            {{ [ (calculated_amps - (amps_c1 | int)), 0 ] | max }}
                          {% elif estrategia_val == 'Porcentaje Personalizado' %}
                            {{ (calculated_amps * (1 - pct_c1)) | int(0) }}
                          {% else %}
                            {{ (calculated_amps / 2) | int(0) }}
                          {% endif %}
                        {% else %}
                          {{ calculated_amps }}
                        {% endif %}

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ not has_priority_block }}"
                          - condition: template
                            value_template: "{{ has_enough_sun }}"
                          - condition: template
                            value_template: "{{ num_active_cars > 0 }}"
                        sequence:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ has_known_car_connected }}"
                                sequence:
                                  - if:
                                      - condition: template
                                        value_template: "{{ not is_state(wb_sw_ent, 'on') }}"
                                    then:
                                      - service: switch.turn_on
                                        target: !input wallbox_switch
                                        continue_on_error: true
                                  - if:
                                      - condition: template
                                        value_template: "{{ is_c1_connected and is_c1_active and var_c1_num != {} and (amps_c1 | float(0)) >= 6 }}"
                                    then:
                                      - variables:
                                          raw_target_c1: "{{ [amps_c1 | float(6), 6] | max }}"
                                          curr_c1_a: "{{ states(c1_num_ent) | float(0) }}"
                                          
                                          c1_obj: "{{ states[c1_num_ent] }}"
                                          c1_sec_since_change: "{{ (now() - c1_obj.last_changed).total_seconds() if (c1_obj is defined and c1_obj.last_changed is defined) else 9999 }}"
                                          
                                          is_overpower_emergency_c1: "{{ max_safe_amps < curr_c1_a }}"
                                          
                                          target_c1: >-
                                            {% if (c1_sec_since_change < amp_delay_sec) and (not is_overpower_emergency_c1) and (curr_c1_a >= 6) %}
                                              {{ curr_c1_a }}
                                            {% else %}
                                              {{ raw_target_c1 }}
                                            {% endif %}

                                          safe_c1_amps: "{{ [ (target_c1 | float(6)), 30 ] | min | int }}"
                                      - if:
                                          - condition: template
                                            value_template: "{{ not is_state(c1_sw_ent, 'on') }}"
                                        then:
                                          - service: switch.turn_on
                                            target: !input car_1_switch
                                            continue_on_error: true
                                      - if:
                                          - condition: template
                                            value_template: "{{ (states(c1_num_ent) | float(0)) != (safe_c1_amps | float(0)) }}"
                                        then:
                                          - service: number.set_value
                                            target: !input car_1_current_number
                                            data:
                                              value: "{{ safe_c1_amps | int }}"
                                            continue_on_error: true
                                  - if:
                                      - condition: template
                                        value_template: "{{ is_c2_connected and is_c2_active and var_c2_num != {} and (amps_c2 | float(0)) >= 6 }}"
                                    then:
                                      - variables:
                                          raw_target_c2: "{{ [amps_c2 | float(6), 6] | max }}"
                                          curr_c2_a: "{{ states(c2_num_ent) | float(0) }}"
                                          c2_obj: "{{ states[c2_num_ent] }}"
                                          c2_sec_since_change: "{{ (now() - c2_obj.last_changed).total_seconds() if (c2_obj is defined and c2_obj.last_changed is defined) else 9999 }}"
                                          
                                          is_overpower_emergency_c2: "{{ max_safe_amps < curr_c2_a }}"
                                          
                                          target_c2: >-
                                            {% if (c2_sec_since_change < amp_delay_sec) and (not is_overpower_emergency_c2) and (curr_c2_a >= 6) %}
                                              {{ curr_c2_a }}
                                            {% else %}
                                              {{ raw_target_c2 }}
                                            {% endif %}

                                          safe_c2_amps: "{{ [ (target_c2 | float(6)), 30 ] | min | int }}"
                                      - if:
                                          - condition: template
                                            value_template: "{{ not is_state(c2_sw_ent, 'on') }}"
                                        then:
                                          - service: switch.turn_on
                                            target: !input car_2_switch
                                            continue_on_error: true
                                      - if:
                                          - condition: template
                                            value_template: "{{ (states(c2_num_ent) | float(0)) != (safe_c2_amps | float(0)) }}"
                                        then:
                                          - service: number.set_value
                                            target: !input car_2_current_number
                                            data:
                                              value: "{{ safe_c2_amps }}"
                                            continue_on_error: true

                            default:
                              - if:
                                  - condition: template
                                    value_template: "{{ not is_state(wb_sw_ent, 'on') }}"
                                then:
                                  - service: switch.turn_on
                                    target: !input wallbox_switch
                                    continue_on_error: true
                              - variables:
                                  raw_target_wb: "{{ [calculated_amps, 6] | max }}"
                                  curr_wb_a: "{{ states(wb_num_ent) | float(0) }}"
                                  wb_obj: "{{ states[wb_num_ent] }}"
                                  wb_sec_since_change: "{{ (now() - wb_obj.last_changed).total_seconds() if (wb_obj is defined and wb_obj.last_changed is defined) else 9999 }}"
                                  
                                  is_overpower_emergency_wb: "{{ max_safe_amps < curr_wb_a }}"
                                  
                                  target_wb: >-
                                    {% if (wb_sec_since_change < amp_delay_sec) and (not is_overpower_emergency_wb) and (curr_wb_a >= 6) %}
                                      {{ curr_wb_a }}
                                    {% else %}
                                      {{ raw_target_wb }}
                                    {% endif %}

                                  safe_wb_amps: >-
                                    {% set m_attr = state_attr(wb_num_ent, 'max') %}
                                    {% set m_lim = (m_attr | float(32)) if (m_attr is not none) else 32 %}
                                    {{ [ (target_wb | float(6)), m_lim ] | min | int }}
                              - if:
                                  - condition: template
                                    value_template: "{{ (states(wb_num_ent) | float(0)) != (safe_wb_amps | float(0)) }}"
                                then:
                                  - service: number.set_value
                                    target: !input wallbox_current_number
                                    data:
                                      value: "{{ safe_wb_amps }}"
                                    continue_on_error: true

                    default:
                      - variables:
                          c1_sw_obj: "{{ states[c1_sw_ent] if (c1_sw_ent is string and c1_sw_ent != '' and c1_sw_ent != 'none' and c1_sw_ent != '{}') else none }}"
                          wb_sw_obj: "{{ states[wb_sw_ent] if (wb_sw_ent is string and wb_sw_ent != '' and wb_sw_ent != 'none' and wb_sw_ent != '{}') else none }}"
                          
                          c1_charge_sec: "{{ (now() - c1_sw_obj.last_changed).total_seconds() if (c1_sw_obj is not none and c1_sw_obj.last_changed is defined and is_state(c1_sw_ent, 'on')) else 9999 }}"
                          wb_charge_sec: "{{ (now() - wb_sw_obj.last_changed).total_seconds() if (wb_sw_obj is not none and wb_sw_obj.last_changed is defined and is_state(wb_sw_ent, 'on')) else 9999 }}"
                          
                          can_stop_c1: "{{ c1_charge_sec >= stop_delay_sec }}"
                          can_stop_wb: "{{ wb_charge_sec >= stop_delay_sec }}"

                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ not can_stop_c1 or not can_stop_wb }}"
                            sequence:
                              - if:
                                  - condition: template
                                    value_template: "{{ is_c1_connected and is_c1_active and var_c1_num != {} }}"
                                then:
                                  - service: number.set_value
                                    target: !input car_1_current_number
                                    data: { value: 6 }
                                    continue_on_error: true

                        default:
                          - if:
                              - condition: template
                                value_template: "{{ not is_state(wb_sw_ent, 'off') }}"
                            then:
                              - service: switch.turn_off
                                target: !input wallbox_switch
                          - if:
                              - condition: template
                                value_template: "{{ var_c1_sw != {} and not is_state(c1_sw_ent, 'off') }}"
                            then:
                              - service: switch.turn_off
                                target: !input car_1_switch

              # -------------------------------------------------------------
              # MODO 4: APAGADO
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ effective_modo == 'Apagado' }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ not is_state(wb_sw_ent, 'off') }}"
                    then:
                      - service: switch.turn_off
                        target: !input wallbox_switch
                  - if:
                      - condition: template
                        value_template: "{{ var_c1_sw != {} and not is_state(c1_sw_ent, 'off') }}"
                    then:
                      - service: switch.turn_off
                        target: !input car_1_switch

            default:
              - if:
                  - condition: template
                    value_template: "{{ not is_state(wb_sw_ent, 'off') }}"
                then:
                  - service: switch.turn_off
                    target: !input wallbox_switch
              - if:
                  - condition: template
                    value_template: "{{ var_c1_sw != {} and not is_state(c1_sw_ent, 'off') }}"
                then:
                  - service: switch.turn_off
                    target: !input car_1_switch

    # SI NO HAY NINGÚN CABLE CONECTADO: Apagar todo
    default:
      - if:
          - condition: template
            value_template: "{{ not is_state(wb_sw_ent, 'off') }}"
        then:
          - service: switch.turn_off
            target: !input wallbox_switch
      - if:
          - condition: template
            value_template: "{{ var_c1_sw != {} and not is_state(c1_sw_ent, 'off') }}"
        then:
          - service: switch.turn_off
            target: !input car_1_switch
      - if:
          - condition: template
            value_template: "{{ var_c2_sw != {} and not is_state(c2_sw_ent, 'off') }}"
        then:
          - service: switch.turn_off
            target: !input car_2_switch
