blueprint:
  name: "EV Smart"
  description: >
    Control de carga avanzado para VE en 4 modos (Apagado, Manual, Tarifa Nocturna/Finde, Solar).
    Soporta detección de cable tanto por el vehículo (Tesla charger_connected) como por el estado OCPP del cargador Raedian (Status Connector != Available).
    Ideal para escenarios multi-vehículo y multi-cargador.
  domain: automation
  input:
    cable_sensor:
      name: "🔌 Sensor de Cable Conectado (Coche o Cargador Raedian)"
      description: >
        Soporta binary_sensor de cable del coche (ej. Tesla connected) o el sensor de estado del cargador Raedian (Status Connector).
        Se considera conectado si el estado del cargador es Preparing, Charging, SuspendedEV, Occupied o si el sensor del coche está en ON.
      selector:
        entity:
          domain: [sensor, binary_sensor]

    modo_carga_select:
      name: "🎛️ Selector de Modo de Carga"
      description: "input_select con las opciones: Apagado, Manual, Nocturno / Finde, Solar."
      selector:
        entity:
          domain: input_select

    amperios_manual_input:
      name: "⚡ Selector Amperios Manual"
      selector:
        entity:
          domain: input_number

    amperios_nocturna_input:
      name: "🌙 Selector Amperios Nocturna"
      selector:
        entity:
          domain: input_number

    hora_inicio_nocturna_input:
      name: "⏰ Hora Inicio Nocturna"
      selector:
        entity:
          domain: input_datetime

    hora_fin_nocturna_input:
      name: "⏰ Hora Fin Nocturna"
      selector:
        entity:
          domain: input_datetime

    wallbox_switch:
      name: "🔌 Switch del Cargador (Wallbox Raedian)"
      description: "Switch del Wallbox (se fijará activado a 32A al detectar cable conectado)."
      selector:
        target:
          entity:
            - domain: switch

    wallbox_current_number:
      name: "⚙️ Amperaje Máximo del Cargador (Wallbox Raedian)"
      description: "Amperaje del Wallbox (se fijará en 32A)."
      default: {}
      selector:
        target:
          entity:
            - domain: number

    car_switch:
      name: "🚗 Control Carga del Vehículo (Tesla Switch/Button)"
      description: "Entidad del vehículo para iniciar/detener la carga."
      selector:
        target:
          entity:
            - domain: switch
            - domain: button

    car_current_number:
      name: "⚙️ Amperaje del Vehículo (Tesla Current Number)"
      description: "Entidad number que ajusta el amperaje de carga directamente en el coche."
      selector:
        target:
          entity:
            - domain: number

    net_power_sensor:
      name: "⚡ Sensor Potencia de Red / Meter (W)"
      description: "Sensor de red GoodWe (Meter 2 Active Power). Negativo cuando exporta a red."
      default: sensor.meter_2_active_power
      selector:
        entity:
          domain: sensor
          device_class: power

    pv_power_sensor:
      name: "☀️ Sensor Producción Solar PV (W)"
      default: sensor.pv_power
      selector:
        entity:
          domain: sensor
          device_class: power

    battery_soc_sensor:
      name: "🔋 Sensor SoC Batería Casa (%)"
      default: sensor.battery_state_of_charge
      selector:
        entity:
          domain: sensor
          device_class: battery

    battery_power_sensor:
      name: "🔋 Sensor Potencia Batería Casa (W)"
      default: sensor.battery_power
      selector:
        entity:
          domain: sensor
          device_class: power

    min_battery_soc_input:
      name: "🔋 Mínimo SoC Batería Casa"
      selector:
        entity:
          domain: input_number

    priority_block_entity:
      name: "🚫 Bloqueo por Dispositivos Prioritarios (Opcional)"
      default: []
      selector:
        entity:

    min_charge_time_input:
      name: "⏱️ Tiempo Mínimo de Carga Continuada (min)"
      selector:
        entity:
          domain: input_number

    stop_delay_input:
      name: "⏱️ Tiempo Mínimo de Pausa (min)"
      selector:
        entity:
          domain: input_number

    amp_change_delay_input:
      name: "🌊 Estabilización de Amperaje (s)"
      selector:
        entity:
          domain: input_number

mode: restart

variables:
  var_cable: !input cable_sensor
  var_modo: !input modo_carga_select
  var_amp_manual: !input amperios_manual_input
  var_amp_nocturna: !input amperios_nocturna_input
  var_h_inicio: !input hora_inicio_nocturna_input
  var_h_fin: !input hora_fin_nocturna_input
  var_wb_sw: !input wallbox_switch
  var_wb_num: !input wallbox_current_number
  var_car_sw: !input car_switch
  var_car_num: !input car_current_number
  var_net_power: !input net_power_sensor
  var_soc: !input battery_soc_sensor
  var_bat_power: !input battery_power_sensor
  var_min_soc: !input min_battery_soc_input
  var_prio_block: !input priority_block_entity
  var_min_charge_m: !input min_charge_time_input
  var_stop_delay_m: !input stop_delay_input
  var_amp_delay_s: !input amp_change_delay_input

trigger:
  - platform: state
    entity_id: !input modo_carga_select
  - platform: state
    entity_id: !input cable_sensor
  - platform: state
    entity_id: !input amperios_manual_input
  - platform: state
    entity_id: !input amperios_nocturna_input
  - platform: state
    entity_id: !input net_power_sensor
  - platform: state
    entity_id: !input battery_soc_sensor
  - platform: state
    entity_id: !input priority_block_entity
  - platform: time_pattern
    minutes: "/1"

action:
  # 1. FILTRO DE SEGURIDAD Y DETECCIÓN INTELIGENTE DE CABLE
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {% set val = states(var_cable) %}
              {# Evalúa si el cable está conectado ya sea por sensor del coche (on/true) o por estado OCPP de Raedian (Preparing, Charging, SuspendedEV, Occupied) #}
              {{ val in ['on', 'true', 'Conectado', 'connected', 'Preparing', 'Charging', 'SuspendedEV', 'SuspendedEVSE', 'Occupied', 'Finishing'] or 
                 (val != 'Available' and val != 'unavailable' and val != 'unknown' and val != 'off') }}
        sequence:
          # --- GESTIÓN DEL WALLBOX: Habilitado a 32A siempre que haya cable ---
          - service: switch.turn_on
            target: !input wallbox_switch
          - if:
              - condition: template
                value_template: "{{ var_wb_num != {} }}"
            then:
              - service: number.set_value
                target: !input wallbox_current_number
                data:
                  value: 32

          # --- GESTIÓN DE MODOS DIRECTAMENTE EN EL VEHÍCULO (TESLA) ---
          - choose:
              # -------------------------------------------------------------
              # MODO 1: MANUAL
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(var_modo, 'Manual') }}"
                sequence:
                  - service: number.set_value
                    target: !input car_current_number
                    data:
                      value: "{{ states(var_amp_manual) | float(16) }}"
                  - service: switch.turn_on
                    target: !input car_switch

              # -------------------------------------------------------------
              # MODO 2: NOCTURNO / FINDE
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(var_modo, 'Nocturno / Finde') }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {% set es_finde = now().weekday() in [5, 6] %}
                              {% set t_now = now().strftime('%H:%M:%S') %}
                              {% set t_start = states(var_h_inicio) %}
                              {% set t_end = states(var_h_fin) %}
                              {% set en_tramo_nocturno = (t_now >= t_start or t_now <= t_end) if (t_start > t_end) else (t_now >= t_start and t_now <= t_end) %}
                              {{ es_finde or en_tramo_nocturno }}
                        sequence:
                          - service: number.set_value
                            target: !input car_current_number
                            data:
                              value: "{{ states(var_amp_nocturna) | float(16) }}"
                          - service: switch.turn_on
                            target: !input car_switch
                    default:
                      - service: switch.turn_off
                        target: !input car_switch

              # -------------------------------------------------------------
              # MODO 3: SOLAR (EXCEDENTES GESTIONADOS EN EL TESLA)
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(var_modo, 'Solar') }}"
                sequence:
                  - variables:
                      car_sw_entity: >-
                        {{ var_car_sw.entity_id[0] if var_car_sw.entity_id is defined and var_car_sw.entity_id is list else (var_car_sw.entity_id if var_car_sw.entity_id is defined else var_car_sw) }}
                      car_num_entity: >-
                        {{ var_car_num.entity_id[0] if var_car_num.entity_id is defined and var_car_num.entity_id is list else (var_car_num.entity_id if var_car_num.entity_id is defined else var_car_num) }}
                      car_state: "{{ states(car_sw_entity) }}"
                      car_last_changed: "{{ (now() - states[car_sw_entity].last_changed).total_seconds() if states[car_sw_entity] is defined and states[car_sw_entity].last_changed is defined else 99999 }}"
                      num_last_changed: "{{ (now() - states[car_num_entity].last_changed).total_seconds() if states[car_num_entity] is defined and states[car_num_entity].last_changed is defined else 99999 }}"
                      min_charge_sec: "{{ (states(var_min_charge_m) | float(5)) * 60 }}"
                      stop_delay_sec: "{{ (states(var_stop_delay_m) | float(3)) * 60 }}"
                      amp_delay_sec: "{{ states(var_amp_delay_s) | float(60) }}"
                      has_priority_block: "{{ var_prio_block != [] and is_state(var_prio_block, 'on') }}"
                      
                      current_soc: "{{ states(var_soc) | float(0) }}"
                      min_soc_req: "{{ states(var_min_soc) | float(80) }}"
                      soc_ok: "{{ current_soc >= min_soc_req }}"
                      
                      net_power_w: "{{ states(var_net_power) | float(0) }}"
                      bat_power_w: "{{ states(var_bat_power) | float(0) if var_bat_power != [] else 0 }}"
                      
                      exported_surplus_w: "{{ (net_power_w * -1) if net_power_w < 0 else 0 }}"
                      battery_charge_surplus_w: "{{ (bat_power_w * -1) if (soc_ok and bat_power_w < 0) else 0 }}"
                      
                      total_available_w: "{{ exported_surplus_w + battery_charge_surplus_w }}"
                      calculated_amps: "{{ (total_available_w / 230) | int(0) }}"
                      has_enough_sun: "{{ calculated_amps >= 6 }}"

                  - choose:
                      # CASO A: Activar o mantener carga solar en Tesla
                      - conditions:
                          - condition: template
                            value_template: "{{ not has_priority_block }}"
                          - condition: template
                            value_template: "{{ soc_ok }}"
                          - condition: template
                            value_template: >-
                              {{ has_enough_sun or (car_state == 'on' and car_last_changed < min_charge_sec) }}
                          - condition: template
                            value_template: >-
                              {{ car_state == 'on' or car_last_changed >= stop_delay_sec }}
                        sequence:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ num_last_changed >= amp_delay_sec }}"
                                sequence:
                                  - service: number.set_value
                                    target: !input car_current_number
                                    data:
                                      value: "{{ [ [calculated_amps, 6] | max, 32 ] | min }}"
                          - service: switch.turn_on
                            target: !input car_switch

                    # CASO B: Parar carga en Tesla
                    default:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ car_state == 'off' or car_last_changed >= min_charge_sec }}"
                            sequence:
                              - service: switch.turn_off
                                target: !input car_switch

              # -------------------------------------------------------------
              # MODO 4: APAGADO
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(var_modo, 'Apagado') }}"
                sequence:
                  - service: switch.turn_off
                    target: !input car_switch

            default:
              - service: switch.turn_off
                target: !input car_switch

    # SI NO HAY CABLE CONECTADO: Apagar Tesla y apagado de seguridad del Wallbox
    default:
      - service: switch.turn_off
        target: !input car_switch
      - service: switch.turn_off
        target: !input wallbox_switch
