blueprint:
  name: "EV Smart"
  description: >
    Control de carga avanzado para VE. Incluye modo Automático (Solar de día / Nocturno de noche),
    Manual, Solar y Nocturno. Configuración del signo de inyección a red para Meter GoodWe,
    Protección Dinámica (10kW / 3.5kW) y Balanceador Multi-Vehículo.
  domain: automation
  input:
    # --- VEHÍCULO 1 (ej. Tesla Propio) ---
    car_1_cable_sensor:
      name: "🚗 Sensor de Cable - Coche 1 (Tesla)"
      description: "Sensor o binary_sensor del coche que indica si el cable está conectado (ej. garaje_nafnaf_cable_de_carga)."
      default: binary_sensor.garaje_nafnaf_cable_de_carga
      selector:
        entity:
          domain: [sensor, binary_sensor]

    car_1_switch:
      name: "🚗 Control Carga - Coche 1 (Tesla Switch)"
      default: {}
      selector:
        target:
          entity:
            - domain: switch
            - domain: button

    car_1_current_number:
      name: "⚙️ Amperaje - Coche 1 (Tesla Current Number)"
      default: {}
      selector:
        target:
          entity:
            - domain: number

    # --- DOCK / WALLBOX ---
    wallbox_cable_sensor:
      name: "🔌 Sensor de Cable del Wallbox (Status Connector - Opcional)"
      description: "Sensor de estado del cargador en la integración OCPP (ej. Status Connector). Déjalo vacío si no tienes esta entidad."
      default: {}
      selector:
        entity:
          domain: [sensor, binary_sensor]

    wallbox_switch:
      name: "🔌 Switch del Cargador (Wallbox Raedian)"
      description: "Switch principal para encender/apagar el Wallbox."
      selector:
        target:
          entity:
            - domain: switch

    wallbox_current_number:
      name: "⚙️ Amperaje del Cargador (Wallbox Raedian)"
      description: "Número de amperios del Wallbox."
      selector:
        target:
          entity:
            - domain: number

    # --- VEHÍCULO 2 (ej. Segundo Coche) ---
    car_2_cable_sensor:
      name: "🚗 Sensor de Cable - Coche 2 (Opcional)"
      default: {}
      selector:
        entity:
          domain: [sensor, binary_sensor]

    car_2_switch:
      name: "🚗 Control Carga - Coche 2 (Opcional)"
      default: {}
      selector:
        target:
          entity:
            - domain: switch
            - domain: button

    car_2_current_number:
      name: "⚙️ Amperaje - Coche 2 (Opcional)"
      default: {}
      selector:
        target:
          entity:
            - domain: number

    # --- CONFIGURACIÓN DE MEDIDOR GOODWE ---
    net_power_sign:
      name: "↕️ Signo del Meter al Exportar/Inyectar Solar a la Red"
      description: "¿Cómo marca tu medidor Meter 2 de GoodWe cuando regalas/exportas energía a la red? (Selecciona Positiva (+) si marca +2500W al inyectar)."
      default: "Positiva (+)"
      selector:
        select:
          options:
            - "Positiva (+)"
            - "Negativa (-)"

    # --- CONFIGURACIÓN DE MODOS Y POTENCIAS ---
    modo_carga_select:
      name: "🎛️ Selector de Modo de Carga"
      selector:
        entity:
          domain: input_select

    estrategia_reparto_select:
      name: "⚖️ Selector Estrategia Reparto Multi-Vehículo"
      default: {}
      selector:
        entity:
          domain: input_select

    porcentaje_coche_1_input:
      name: "📊 Porcentaje Reparto Coche 1"
      default: {}
      selector:
        entity:
          domain: input_number

    max_house_power_input:
      name: "⚡ Límite Potencia Combinada (Solar/Batería) (W)"
      default: {}
      selector:
        entity:
          domain: input_number

    max_grid_power_input:
      name: "🔌 Límite Potencia Solo Red (Sin Batería/Solar) (W)"
      default: {}
      selector:
        entity:
          domain: input_number

    amperios_manual_input:
      name: "⚡ Selector Amperios Manual"
      selector:
        entity:
          domain: input_number

    amperios_nocturna_input:
      name: "🌙 Selector Amperios Nocturna"
      selector:
        entity:
          domain: input_number

    hora_inicio_nocturna_input:
      name: "⏰ Hora Inicio Nocturna"
      selector:
        entity:
          domain: input_datetime

    hora_fin_nocturna_input:
      name: "⏰ Hora Fin Nocturna"
      selector:
        entity:
          domain: input_datetime

    net_power_sensor:
      name: "⚡ Sensor Potencia de Red / Meter (W)"
      default: sensor.meter_2_active_power
      selector:
        entity:
          domain: sensor
          device_class: power

    pv_power_sensor:
      name: "☀️ Sensor Producción Solar PV (W)"
      default: sensor.pv_power
      selector:
        entity:
          domain: sensor
          device_class: power

    battery_soc_sensor:
      name: "🔋 Sensor SoC Batería Casa (%)"
      default: sensor.battery_state_of_charge
      selector:
        entity:
          domain: sensor
          device_class: battery

    battery_power_sensor:
      name: "🔋 Sensor Potencia Batería Casa (W)"
      default: sensor.battery_power
      selector:
        entity:
          domain: sensor
          device_class: power

    min_battery_soc_input:
      name: "🔋 Mínimo SoC Batería Casa"
      selector:
        entity:
          domain: input_number

    priority_block_entity:
      name: "🚫 Bloqueo por Dispositivos Prioritarios (Opcional)"
      default: []
      selector:
        entity:

    min_charge_time_input:
      name: "⏱️ Tiempo Mínimo de Carga Continuada (min)"
      selector:
        entity:
          domain: input_number

    stop_delay_input:
      name: "⏱️ Tiempo Mínimo de Pausa (min)"
      selector:
        entity:
          domain: input_number

    amp_change_delay_input:
      name: "🌊 Estabilización de Amperaje (s)"
      selector:
        entity:
          domain: input_number

mode: restart

variables:
  var_wb_cable: !input wallbox_cable_sensor
  var_c1_cable: !input car_1_cable_sensor
  var_c2_cable: !input car_2_cable_sensor
  var_sign_setting: !input net_power_sign
  var_modo: !input modo_carga_select
  var_estrategia: !input estrategia_reparto_select
  var_p_coche1: !input porcentaje_coche_1_input
  var_max_house_w: !input max_house_power_input
  var_max_grid_w: !input max_grid_power_input
  var_amp_manual: !input amperios_manual_input
  var_amp_nocturna: !input amperios_nocturna_input
  var_h_inicio: !input hora_inicio_nocturna_input
  var_h_fin: !input hora_fin_nocturna_input
  var_wb_sw: !input wallbox_switch
  var_wb_num: !input wallbox_current_number
  var_c1_sw: !input car_1_switch
  var_c1_num: !input car_1_current_number
  var_c2_sw: !input car_2_switch
  var_c2_num: !input car_2_current_number
  var_net_power: !input net_power_sensor
  var_pv_power: !input pv_power_sensor
  var_soc: !input battery_soc_sensor
  var_bat_power: !input battery_power_sensor
  var_min_soc: !input min_battery_soc_input
  var_prio_block: !input priority_block_entity
  var_min_charge_m: !input min_charge_time_input
  var_stop_delay_m: !input stop_delay_input
  var_amp_delay_s: !input amp_change_delay_input

trigger:
  - platform: state
    entity_id: !input modo_carga_select
  - platform: state
    entity_id: !input wallbox_cable_sensor
  - platform: state
    entity_id: !input car_1_cable_sensor
  - platform: state
    entity_id: !input car_2_cable_sensor
  - platform: state
    entity_id: !input amperios_manual_input
  - platform: state
    entity_id: !input amperios_nocturna_input
  - platform: state
    entity_id: !input net_power_sensor
  - platform: state
    entity_id: !input battery_soc_sensor
  - platform: state
    entity_id: !input priority_block_entity
  - platform: time_pattern
    minutes: "/1"

action:
  # 1. EVALUACIÓN INTELIGENTE DE CABLES CONECTADOS
  - variables:
      wb_val: "{{ (states(var_wb_cable) | lower) if var_wb_cable != {} else 'unavailable' }}"
      c1_val: "{{ (states(var_c1_cable) | lower) if var_c1_cable != {} else 'unavailable' }}"
      c2_val: "{{ (states(var_c2_cable) | lower) if var_c2_cable != {} else 'unavailable' }}"

      is_wb_connected: >-
        {{ wb_val in ['on', 'true', 'conectado', 'connected', 'preparing', 'charging', 'suspendedev', 'suspendedevse', 'occupied', 'finishing', '1'] }}
      is_c1_connected: >-
        {{ c1_val in ['on', 'true', 'conectado', 'connected', 'charging', 'pluggedin', '1'] }}
      is_c2_connected: >-
        {{ c2_val in ['on', 'true', 'conectado', 'connected', 'charging', 'pluggedin', '1'] }}

      any_cable_connected: "{{ is_wb_connected or is_c1_connected or is_c2_connected }}"
      has_known_car_connected: "{{ is_c1_connected or is_c2_connected }}"

      raw_modo_str: "{{ states(var_modo) }}"
      es_finde: "{{ now().weekday() in [5, 6] }}"
      t_now: "{{ now().strftime('%H:%M:%S') }}"
      t_start: "{{ states(var_h_inicio) }}"
      t_end: "{{ states(var_h_fin) }}"
      en_tramo_nocturno: "{{ (t_now >= t_start or t_now <= t_end) if (t_start > t_end) else (t_now >= t_start and t_now <= t_end) }}"
      es_horario_nocturno: "{{ es_finde or en_tramo_nocturno }}"

      effective_modo: >-
        {% if 'Automático' in raw_modo_str %}
          {{ 'Nocturno / Finde' if es_horario_nocturno else 'Solar' }}
        {% else %}
          {{ raw_modo_str }}
        {% endif %}

  # 2. FILTRO GENERAL DE CABLE
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ any_cable_connected }}"
        sequence:
          # --- CÁLCULO DE PROTECCIÓN DE POTENCIA DINÁMICA Y EXCEDENTES DE RED ---
          - variables:
              pv_w: "{{ states(var_pv_power) | float(0) }}"
              soc_val: "{{ states(var_soc) | float(0) }}"
              has_energy_support: "{{ pv_w > 100 or soc_val > 10 }}"
              
              limit_combined_w: "{{ states(var_max_house_w) | float(10000) if var_max_house_w != {} else 10000 }}"
              limit_grid_only_w: "{{ states(var_max_grid_w) | float(3500) if var_max_grid_w != {} else 3500 }}"
              
              effective_house_limit_w: "{{ limit_combined_w if has_energy_support else limit_grid_only_w }}"
              
              raw_grid_w: "{{ states(var_net_power) | float(0) }}"
              net_power_w: "{{ (raw_grid_w * -1) if var_sign_setting == 'Positiva (+)' else raw_grid_w }}"
              
              available_grid_margin_w: "{{ [ (effective_house_limit_w - (raw_grid_w if var_sign_setting == 'Positiva (+)' else (raw_grid_w * -1))), 0 ] | max }}"
              max_safe_amps: "{{ (available_grid_margin_w / 230) | int(0) }}"

          # --- GESTIÓN DE MODOS Y EJECUCIÓN ---
          - choose:
              # -------------------------------------------------------------
              # MODO 1: MANUAL
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ effective_modo == 'Manual' }}"
                sequence:
                  - variables:
                      target_amps: "{{ [ (states(var_amp_manual) | float(16)), max_safe_amps ] | min }}"
                      desired_amps: "{{ [ [target_amps, 6] | max, 32 ] | min }}"
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ has_known_car_connected }}"
                        sequence:
                          - service: switch.turn_on
                            target: !input wallbox_switch
                          - service: number.set_value
                            target: !input wallbox_current_number
                            data: { value: 32 }
                          - if:
                              - condition: template
                                value_template: "{{ is_c1_connected and var_c1_num != {} }}"
                            then:
                              # ENCENDER PRIMERO EL COCHE PARA DESBLOQUEAR LA ENTIDAD NUMBER DE TESLA
                              - service: switch.turn_on
                                target: !input car_1_switch
                              - variables:
                                  c1_ent: "{{ var_c1_num.entity_id[0] if var_c1_num.entity_id is defined and var_c1_num.entity_id is list else (var_c1_num.entity_id if var_c1_num.entity_id is defined else var_c1_num) }}"
                                  c1_min: "{{ state_attr(c1_ent, 'min') | float(0) if state_attr(c1_ent, 'min') is not none else 0 }}"
                                  c1_max: "{{ state_attr(c1_ent, 'max') | float(32) if state_attr(c1_ent, 'max') is not none else 32 }}"
                                  safe_c1_amps: "{{ [ [desired_amps, c1_min] | max, c1_max ] | min }}"
                              - service: number.set_value
                                target: !input car_1_current_number
                                data: { value: "{{ safe_c1_amps }}" }

                    default:
                      - service: switch.turn_on
                        target: !input wallbox_switch
                      - variables:
                          wb_ent: "{{ var_wb_num.entity_id[0] if var_wb_num.entity_id is defined and var_wb_num.entity_id is list else (var_wb_num.entity_id if var_wb_num.entity_id is defined else var_wb_num) }}"
                          wb_min: "{{ state_attr(wb_ent, 'min') | float(6) if state_attr(wb_ent, 'min') is not none else 6 }}"
                          wb_max: "{{ state_attr(wb_ent, 'max') | float(32) if state_attr(wb_ent, 'max') is not none else 32 }}"
                          safe_wb_amps: "{{ [ [desired_amps, wb_min] | max, wb_max ] | min }}"
                      - service: number.set_value
                        target: !input wallbox_current_number
                        data: { value: "{{ safe_wb_amps }}" }

              # -------------------------------------------------------------
              # MODO 2: NOCTURNO / FINDE
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ effective_modo == 'Nocturno / Finde' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ es_horario_nocturno }}"
                        sequence:
                          - variables:
                              target_amps: "{{ [ (states(var_amp_nocturna) | float(16)), max_safe_amps ] | min }}"
                              desired_amps: "{{ [ [target_amps, 6] | max, 32 ] | min }}"
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ has_known_car_connected }}"
                                sequence:
                                  - service: switch.turn_on
                                    target: !input wallbox_switch
                                  - service: number.set_value
                                    target: !input wallbox_current_number
                                    data: { value: 32 }
                                  - if:
                                      - condition: template
                                        value_template: "{{ is_c1_connected and var_c1_num != {} }}"
                                    then:
                                      - service: switch.turn_on
                                        target: !input car_1_switch
                                      - variables:
                                          c1_ent: "{{ var_c1_num.entity_id[0] if var_c1_num.entity_id is defined and var_c1_num.entity_id is list else (var_c1_num.entity_id if var_c1_num.entity_id is defined else var_c1_num) }}"
                                          c1_min: "{{ state_attr(c1_ent, 'min') | float(0) if state_attr(c1_ent, 'min') is not none else 0 }}"
                                          c1_max: "{{ state_attr(c1_ent, 'max') | float(32) if state_attr(c1_ent, 'max') is not none else 32 }}"
                                          safe_c1_amps: "{{ [ [desired_amps, c1_min] | max, c1_max ] | min }}"
                                      - service: number.set_value
                                        target: !input car_1_current_number
                                        data: { value: "{{ safe_c1_amps }}" }

                            default:
                              - service: switch.turn_on
                                target: !input wallbox_switch
                              - variables:
                                  wb_ent: "{{ var_wb_num.entity_id[0] if var_wb_num.entity_id is defined and var_wb_num.entity_id is list else (var_wb_num.entity_id if var_wb_num.entity_id is defined else var_wb_num) }}"
                                  wb_min: "{{ state_attr(wb_ent, 'min') | float(6) if state_attr(wb_ent, 'min') is not none else 6 }}"
                                  wb_max: "{{ state_attr(wb_ent, 'max') | float(32) if state_attr(wb_ent, 'max') is not none else 32 }}"
                                  safe_wb_amps: "{{ [ [desired_amps, wb_min] | max, wb_max ] | min }}"
                              - service: number.set_value
                                target: !input wallbox_current_number
                                data: { value: "{{ safe_wb_amps }}" }

                    default:
                      - service: switch.turn_off
                        target: !input wallbox_switch
                      - if:
                          - condition: template
                            value_template: "{{ var_c1_sw != {} }}"
                        then:
                          - service: switch.turn_off
                            target: !input car_1_switch

              # -------------------------------------------------------------
              # MODO 3: SOLAR (EXCEDENTES)
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ effective_modo == 'Solar' }}"
                sequence:
                  - variables:
                      min_charge_sec: "{{ (states(var_min_charge_m) | float(5)) * 60 }}"
                      stop_delay_sec: "{{ (states(var_stop_delay_m) | float(3)) * 60 }}"
                      amp_delay_sec: "{{ states(var_amp_delay_s) | float(60) }}"
                      has_priority_block: "{{ var_prio_block != [] and is_state(var_prio_block, 'on') }}"
                      
                      current_soc: "{{ states(var_soc) | float(0) }}"
                      min_soc_req: "{{ states(var_min_soc) | float(80) }}"
                      soc_ok: "{{ current_soc >= min_soc_req }}"
                      
                      bat_power_w: "{{ states(var_bat_power) | float(0) if var_bat_power != [] else 0 }}"
                      
                      exported_surplus_w: "{{ (net_power_w * -1) if net_power_w < 0 else 0 }}"
                      battery_charge_surplus_w: "{{ (bat_power_w * -1) if (soc_ok and bat_power_w < 0) else 0 }}"
                      
                      total_available_w: "{{ exported_surplus_w + battery_charge_surplus_w }}"
                      raw_calculated_amps: "{{ (total_available_w / 230) | int(0) }}"
                      calculated_amps: "{{ [ raw_calculated_amps, max_safe_amps ] | min }}"
                      has_enough_sun: "{{ calculated_amps >= 6 }}"

                      estrategia_val: "{{ states(var_estrategia) if var_estrategia != {} else 'Equitativo (50/50)' }}"
                      pct_c1: "{{ (states(var_p_coche1) | float(50)) / 100.0 if var_p_coche1 != {} else 0.5 }}"
                      
                      amps_c1: >-
                        {% if estrategia_val == 'Prioridad (Coche 1)' %}
                          {{ calculated_amps }}
                        {% elif estrategia_val == 'Porcentaje Personalizado' %}
                          {{ (calculated_amps * pct_c1) | int(0) }}
                        {% else %}
                          {{ (calculated_amps / 2) | int(0) }}
                        {% endif %}

                      amps_c2: >-
                        {% if estrategia_val == 'Prioridad (Coche 1)' %}
                          {{ [ (calculated_amps - (amps_c1 | int)), 0 ] | max }}
                        {% elif estrategia_val == 'Porcentaje Personalizado' %}
                          {{ (calculated_amps * (1 - pct_c1)) | int(0) }}
                        {% else %}
                          {{ (calculated_amps / 2) | int(0) }}
                        {% endif %}

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ not has_priority_block }}"
                          - condition: template
                            value_template: "{{ soc_ok }}"
                          - condition: template
                            value_template: "{{ has_enough_sun }}"
                        sequence:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ has_known_car_connected }}"
                                sequence:
                                  - service: switch.turn_on
                                    target: !input wallbox_switch
                                  - service: number.set_value
                                    target: !input wallbox_current_number
                                    data: { value: 32 }
                                  - if:
                                      - condition: template
                                        value_template: "{{ is_c1_connected and var_c1_num != {} }}"
                                    then:
                                      # 1. ENCENDER SWITCH DEL TESLA PRIMERO
                                      - service: switch.turn_on
                                        target: !input car_1_switch
                                      # 2. LER LIMITES DE LA ENTIDAD NUMBER PARA EVITAR OUT_OF_RANGE
                                      - variables:
                                          c1_ent: "{{ var_c1_num.entity_id[0] if var_c1_num.entity_id is defined and var_c1_num.entity_id is list else (var_c1_num.entity_id if var_c1_num.entity_id is defined else var_c1_num) }}"
                                          c1_min: "{{ state_attr(c1_ent, 'min') | float(0) if state_attr(c1_ent, 'min') is not none else 0 }}"
                                          c1_max: "{{ state_attr(c1_ent, 'max') | float(32) if state_attr(c1_ent, 'max') is not none else 32 }}"
                                          target_c1: "{{ [amps_c1 | float(6), 6] | max }}"
                                          safe_c1_amps: "{{ [ [target_c1, c1_min] | max, c1_max ] | min }}"
                                      # 3. ESTABLECER VALOR DE CORRIENTE
                                      - service: number.set_value
                                        target: !input car_1_current_number
                                        data:
                                          value: "{{ safe_c1_amps }}"
                                  - if:
                                      - condition: template
                                        value_template: "{{ is_c2_connected and var_c2_num != {} and (amps_c2 | float(0)) >= 6 }}"
                                    then:
                                      - service: switch.turn_on
                                        target: !input car_2_switch
                                      - variables:
                                          c2_ent: "{{ var_c2_num.entity_id[0] if var_c2_num.entity_id is defined and var_c2_num.entity_id is list else (var_c2_num.entity_id if var_c2_num.entity_id is defined else var_c2_num) }}"
                                          c2_min: "{{ state_attr(c2_ent, 'min') | float(0) if state_attr(c2_ent, 'min') is not none else 0 }}"
                                          c2_max: "{{ state_attr(c2_ent, 'max') | float(32) if state_attr(c2_ent, 'max') is not none else 32 }}"
                                          target_c2: "{{ [amps_c2 | float(6), 6] | max }}"
                                          safe_c2_amps: "{{ [ [target_c2, c2_min] | max, c2_max ] | min }}"
                                      - service: number.set_value
                                        target: !input car_2_current_number
                                        data:
                                          value: "{{ safe_c2_amps }}"

                            default:
                              - service: switch.turn_on
                                target: !input wallbox_switch
                              - variables:
                                  wb_ent: "{{ var_wb_num.entity_id[0] if var_wb_num.entity_id is defined and var_wb_num.entity_id is list else (var_wb_num.entity_id if var_wb_num.entity_id is defined else var_wb_num) }}"
                                  wb_min: "{{ state_attr(wb_ent, 'min') | float(6) if state_attr(wb_ent, 'min') is not none else 6 }}"
                                  wb_max: "{{ state_attr(wb_ent, 'max') | float(32) if state_attr(wb_ent, 'max') is not none else 32 }}"
                                  target_wb: "{{ [calculated_amps, 6] | max }}"
                                  safe_wb_amps: "{{ [ [target_wb, wb_min] | max, wb_max ] | min }}"
                              - service: number.set_value
                                target: !input wallbox_current_number
                                data:
                                  value: "{{ safe_wb_amps }}"

                    default:
                      - service: switch.turn_off
                        target: !input wallbox_switch
                      - if:
                          - condition: template
                            value_template: "{{ var_c1_sw != {} }}"
                        then:
                          - service: switch.turn_off
                            target: !input car_1_switch

              # -------------------------------------------------------------
              # MODO 4: APAGADO
              # -------------------------------------------------------------
              - conditions:
                  - condition: template
                    value_template: "{{ effective_modo == 'Apagado' }}"
                sequence:
                  - service: switch.turn_off
                    target: !input wallbox_switch
                  - if:
                      - condition: template
                        value_template: "{{ var_c1_sw != {} }}"
                    then:
                      - service: switch.turn_off
                        target: !input car_1_switch

            default:
              - service: switch.turn_off
                target: !input wallbox_switch
              - if:
                  - condition: template
                    value_template: "{{ var_c1_sw != {} }}"
                then:
                  - service: switch.turn_off
                    target: !input car_1_switch

    # SI NO HAY NINGÚN CABLE CONECTADO: Apagar todo
    default:
      - service: switch.turn_off
        target: !input wallbox_switch
      - if:
          - condition: template
            value_template: "{{ var_c1_sw != {} }}"
        then:
          - service: switch.turn_off
            target: !input car_1_switch
      - if:
          - condition: template
            value_template: "{{ var_c2_sw != {} }}"
        then:
          - service: switch.turn_off
            target: !input car_2_switch
