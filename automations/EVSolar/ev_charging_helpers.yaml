# ==============================================================================
# PAQUETE DE AYUDANTES (HELPERS) PARA EL CONTROL DE CARGA DEL VEHÍCULO ELÉCTRICO
# Ubicación: ev_charging_control/ev_charging_helpers.yaml
# ==============================================================================

input_select:
  modo_carga_ev:
    name: "Modo Carga EV"
    options:
      - "Apagado"
      - "Manual"
      - "Nocturno / Finde"
      - "Solar"
    icon: mdi:ev-station

  estrategia_reparto_ev:
    name: "Estrategia Reparto Multi-Vehículo"
    options:
      - "Equitativo (50/50)"
      - "Prioridad (Coche 1)"
      - "Porcentaje Personalizado"
    icon: mdi:scale-balance

input_number:
  amperios_carga_manual:
    name: "Amperaje Carga Manual"
    min: 6
    max: 32
    step: 1
    initial: 16
    unit_of_measurement: "A"
    icon: mdi:current-ac

  amperios_carga_nocturna:
    name: "Amperaje Carga Nocturna / Finde"
    min: 6
    max: 32
    step: 1
    initial: 16
    unit_of_measurement: "A"
    icon: mdi:weather-night

  ev_solar_min_battery_soc:
    name: "Mínimo SoC Batería Casa para Carga Solar"
    min: 0
    max: 100
    step: 5
    initial: 80
    unit_of_measurement: "%"
    icon: mdi:battery-charging-80

  potencia_maxima_casa_w:
    name: "Límite Potencia Combinada (Solar / Batería)"
    min: 3000
    max: 15000
    step: 500
    initial: 10000
    unit_of_measurement: "W"
    icon: mdi:transmission-tower-export

  potencia_maxima_red_w:
    name: "Límite Potencia Solo Red (Sin Batería/Solar)"
    min: 1500
    max: 10000
    step: 500
    initial: 3500
    unit_of_measurement: "W"
    icon: mdi:power-plug-outline

  ev_porcentaje_coche_1:
    name: "Porcentaje Reparto Coche 1"
    min: 0
    max: 100
    step: 5
    initial: 50
    unit_of_measurement: "%"
    icon: mdi:percent

  ev_min_charge_time_min:
    name: "Tiempo Mínimo de Carga Continuada"
    min: 1
    max: 30
    step: 1
    initial: 5
    unit_of_measurement: "min"
    icon: mdi:timer-sand

  ev_stop_delay_min:
    name: "Tiempo Mínimo de Pausa entre Cargas"
    min: 1
    max: 30
    step: 1
    initial: 3
    unit_of_measurement: "min"
    icon: mdi:timer-pause

  ev_amp_change_delay_sec:
    name: "Estabilización de Cambio de Amperaje"
    min: 15
    max: 300
    step: 15
    initial: 60
    unit_of_measurement: "s"
    icon: mdi:sine-wave

input_datetime:
  hora_inicio_nocturna:
    name: "Hora Inicio Tarifa Nocturna"
    has_date: false
    has_time: true
    initial: "22:00:00"

  hora_fin_nocturna:
    name: "Hora Fin Tarifa Nocturna"
    has_date: false
    has_time: true
    initial: "08:00:00"

input_boolean:
  ev_prioridad_bloqueada:
    name: "Bloqueo por Cargas Prioritarias (Termo / Aerotermia)"
    initial: false
    icon: mdi:thunderstorm-outline
